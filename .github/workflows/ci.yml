name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Syntax check
        run: |
          node --check bin/cli.js
          for f in src/*.js; do node --check "$f"; done
          for f in test/*.js test/*.mjs; do node --check "$f"; done
      - name: Unit tests — referential-integrity resolver
        run: npm test
      - name: Web engine parity check
        run: node web/parity-check.mjs
      - name: Smoke test — auto mode (no LLM)
        run: |
          node bin/cli.js auto -s examples/schema_ecommerce.sql -o ci.db --rows 200
          node -e "
            const initSqlJs = require('sql.js');
            const fs = require('fs');
            initSqlJs().then(SQL => {
              const db = new SQL.Database(fs.readFileSync('ci.db'));
              const v = db.exec('PRAGMA foreign_key_check');
              if (v.length) { console.error('FK violations!'); process.exit(1); }
              console.log('FK check clean');
            });"
      - name: Smoke test — plan mode + reproducibility
        run: |
          node bin/cli.js generate -s examples/schema_ecommerce.sql -P examples/ecommerce_plan.yaml -o a.db --seed 42
          node bin/cli.js generate -s examples/schema_ecommerce.sql -P examples/ecommerce_plan.yaml -o b.db --seed 42
          node -e "
            const { createHash } = require('crypto');
            const fs = require('fs');
            const h = f => createHash('sha256').update(fs.readFileSync(f)).digest('hex');
            const [a, b] = [h('a.db'), h('b.db')];
            if (a !== b) { console.error('NOT reproducible:', a, b); process.exit(1); }
            console.log('byte-identical: reproducibility holds (' + a.slice(0, 12) + ')');"
