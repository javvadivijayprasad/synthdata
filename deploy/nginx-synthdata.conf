# nginx server block for synthdata.testforge-ai.com (static single-file app)
# Place at /etc/nginx/sites-available/synthdata, symlink into sites-enabled.
# certbot will add the SSL server block automatically (see DEPLOY.md).

server {
    listen 80;
    listen [::]:80;
    server_name synthdata.testforge-ai.com;

    root /var/www/synthdata;
    index index.html;

    # single-page static app
    location / {
        try_files $uri /index.html;
    }

    # long cache for the page's CDN assets is handled by the CDNs themselves;
    # keep index.html fresh so updates roll out immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
}
